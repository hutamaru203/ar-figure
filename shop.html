<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>店舗ポスターARテスト | ARデジタルフィギュア</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  body { margin: 0; font-family: sans-serif; }
  #guide {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: rgba(0,0,0,.65); color: #fff; padding: 10px 16px; border-radius: 999px;
    font-size: 14px; z-index: 10; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="guide">ポスターにカメラを向けてください</div>

<a-scene
  mindar-image="imageTargetSrc: ./shop_targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; missTolerance: 30;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="figure" src="./my_humanoid.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- 店内の明かり（シーン全体） -->
  <a-light type="ambient" color="#ffe6c4" intensity="0.6"></a-light>
  <a-light type="directional" color="#fff2dd" intensity="0.7" position="0.5 1 0.8"></a-light>

  <a-entity mindar-image-target="targetIndex: 0">
    <!-- オクルーダー＋店内ジオメトリ（下のスクリプトで構築） -->
    <a-entity id="shopset" shop-interior></a-entity>

    <!-- 店内の暖かい光 -->
    <a-light type="point" color="#ffb36b" intensity="0.6" decay="1" position="0.02 0.35 -0.35"></a-light>

    <!-- 店員：窓の内側、カウンターの後ろ。全身が見える大きさ、足は店内の床（y=-0.535） -->
    <a-gltf-model id="clerk" src="#figure" position="-0.09 -0.535 -0.52" rotation="0 0 0" scale="0.207 0.207 0.207"></a-gltf-model>
  </a-entity>

</a-scene>

<script>
  // 店員モデルの全メッシュに renderOrder=2 を付け、オクルーダー（=1）より後に描く
  document.getElementById('clerk').addEventListener('model-loaded', function (e) {
    e.detail.model.traverse(function (o) { if (o.isMesh) o.renderOrder = 2; });
  });

  AFRAME.registerComponent('shop-interior', {
    init: function () {
      var root = this.el.object3D;

      // ===== 窓（開口部）の実測値 =====
      // ポスター画像（1140x1612）の暗部検出: left 0.1784 / right 0.8521 / top 0.0991 / bottom 0.8922（画像比率）
      // マーカー正規化座標（幅1、高さ H=1612/1140=1.4140）へ変換し、穴は各辺 0.010 内側に寄せた
      var H = 1612 / 1140;
      var WIN = { x0: -0.3116, x1: 0.3421, y0: -0.5446, y1: 0.5569 };
      var CX = (WIN.x0 + WIN.x1) / 2;   // 窓の中心 x = 0.0153
      var WW = WIN.x1 - WIN.x0;         // 窓の幅 0.6537

      // ===== オクルーダー：ポスター平面（1 x H）に窓の穴だけ開いた見えない壁 =====
      var shape = new THREE.Shape();
      shape.moveTo(-0.5, -H / 2);
      shape.lineTo(0.5, -H / 2);
      shape.lineTo(0.5, H / 2);
      shape.lineTo(-0.5, H / 2);
      shape.closePath();
      var hole = new THREE.Path();
      hole.moveTo(WIN.x0, WIN.y0);
      hole.lineTo(WIN.x1, WIN.y0);
      hole.lineTo(WIN.x1, WIN.y1);
      hole.lineTo(WIN.x0, WIN.y1);
      hole.closePath();
      shape.holes.push(hole);
      var occ = new THREE.Mesh(
        new THREE.ShapeGeometry(shape),
        new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true })
      );
      occ.renderOrder = 1;
      root.add(occ);

      // ===== 店内（ポスター平面より奥、z は 0 〜 -0.85） =====
      var FLOOR = WIN.y0 + 0.01;        // 店内の床の高さ（窓の下端付近）= -0.535
      var DEPTH = 0.85;                 // 店の奥行き
      var palette = [0xc0392b, 0xd4a017, 0x2e6f5e, 0x31597f, 0xb3541e, 0x7a3b5d, 0xe0e0e0, 0x8a3324];
      var seed = 42;
      function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
      function box(w, h, d, color, x, y, z) {
        var m = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshStandardMaterial({ color: color, roughness: 0.85, metalness: 0 })
        );
        m.position.set(x, y, z);
        m.renderOrder = 2;
        root.add(m);
        return m;
      }
      var roomH = WIN.y1 - FLOOR + 0.04;         // 床から天井までの高さ
      var roomCY = FLOOR + roomH / 2 - 0.02;

      // 床・背面・側壁・天井（側壁と天井は窓の縁に合わせる）
      box(WW + 0.06, 0.02, DEPTH + 0.02, 0x5d4028, CX, FLOOR - 0.01, -DEPTH / 2);              // 床
      box(WW + 0.06, roomH, 0.02, 0xe8d9b8, CX, roomCY, -DEPTH - 0.01);                        // 背面（クリーム）
      box(0.02, roomH, DEPTH + 0.02, 0x8a5a33, WIN.x0 - 0.01, roomCY, -DEPTH / 2);             // 左壁
      box(0.02, roomH, DEPTH + 0.02, 0x8a5a33, WIN.x1 + 0.01, roomCY, -DEPTH / 2);             // 右壁
      box(WW + 0.06, 0.02, DEPTH + 0.02, 0x6e4525, CX, WIN.y1 + 0.01, -DEPTH / 2);             // 天井

      // カウンター（天板 y=-0.10、店員の腰あたり。店員は z=-0.52 でその奥）
      box(0.56, 0.42, 0.16, 0x6e4525, CX, FLOOR + 0.21, -0.30);                                // 本体
      box(0.60, 0.03, 0.20, 0x9c6b3f, CX, -0.115, -0.30);                                      // 天板
      box(0.07, 0.07, 0.07, 0xc0392b, CX - 0.17, -0.065, -0.27);                               // 天板の小物
      box(0.05, 0.10, 0.05, 0xd4a017, CX + 0.18, -0.05, -0.28);                                // 天板の小物

      // 背面の棚：棚板2段＋色付きの薄い箱（本・商品）
      [FLOOR + 0.58, FLOOR + 0.84].forEach(function (shelfY) {
        box(WW - 0.04, 0.025, 0.12, 0x8a5a33, CX, shelfY, -DEPTH + 0.07);
        var x = WIN.x0 + 0.03;
        while (x < WIN.x1 - 0.06) {
          var bw = 0.034 + rnd() * 0.022;
          var bh = 0.13 + rnd() * 0.07;
          var col = palette[Math.floor(rnd() * palette.length)];
          box(bw, bh, 0.07, col, x + bw / 2, shelfY + 0.0125 + bh / 2, -DEPTH + 0.07);
          x += bw + 0.006 + rnd() * 0.014;
        }
      });
    }
  });
</script>
</body>
</html>
