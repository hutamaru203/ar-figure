
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARデジタルフィギュア</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #f4f4f4;
      color: #222;
    }
    h1 { font-size: 1.5rem; }
    p { padding: 0 16px; }
    model-viewer {
      width: 100%;
      height: 65vh;
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>わたしのARフィギュア</h1>
  <p>下のボタンからAR表示を試してみよう！</p>

  <model-viewer
   src="./my_humanoid.glb"
alt="自作ヒューマノイド"
    ar
    ar-modes="quick-look scene-viewer webxr"
    camera-controls
    auto-rotate>
  </model-viewer>

  <p>フィギュアを回転させて確認できます。</p>
</body>
</html>
