<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARデジタルフィギュア</title>
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
  </script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #f4f4f4;
      color: #222;
    }
    h1 {
      font-size: 1.5rem;
      padding: 16px 16px 4px;
    }
    p {
      padding: 0 16px;
      line-height: 1.6;
    }
    model-viewer {
      width: 100%;
      height: 60vh;
      background: #fff;
    }
    #ar-button {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 1.05rem;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      cursor: pointer;
    }
    #ar-button:active {
      background: #1558b0;
    }
    .howto {
      text-align: left;
      max-width: 560px;
      margin: 8px auto;
      background: #fff;
      border-radius: 12px;
      padding: 12px 20px;
    }
    .howto li {
      margin: 6px 0;
      line-height: 1.6;
    }
    .exp {
      margin: 20px 16px 32px;
      font-size: .95rem;
    }
    .exp a {
      color: #1a73e8;
    }
  </style>
</head>
<body>
  <h1>わたしのARフィギュア</h1>
  <p>自作ヒューマノイドのARフィギュアです。<br>静かに呼吸しています。</p>

  <model-viewer
    src="./my_humanoid.glb"
    ios-src="./my_humanoid_breathing.usdz"
    alt="自作ヒューマノイド"
    ar
    ar-modes="quick-look scene-viewer webxr"
    camera-controls
    auto-rotate>
    <button id="ar-button" slot="ar-button">📷 ARで見る</button>
  </model-viewer>

  <div class="howto">
    <ol>
      <li>「ARで見る」を押します（iPhoneは標準のAR表示が開きます）</li>
      <li>平らな場所（机や床）にスマホを向けて、フィギュアを置きます</li>
      <li>置いた後は、QRコードが画面から外れてもフィギュアはその場所に残ります</li>
    </ol>
  </div>

  <p class="exp">
    実験ページ：
    <a href="./marker.html">QRコードの上に立たせる</a>／
    <a href="./marker2.html">見失っても残る版</a>
  </p>
</body>
</html>
